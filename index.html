<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Daanish Qayyum</title>
  </head>
  <body class="bg-pink-100 min-h-[250vh] m-0">

    
    <div class="relative w-full h-[700px] overflow-hidden">
      
    
      <video 
        src="video.mp4" 
        autoplay 
        loop 
        muted 
        playsinline 
        class="absolute inset-0 w-full h-full object-cover object-center"
      ></video>

      <!-- Name & Bio Sitting Over the Video -->
      <div class="relative z-10 p-8 max-w-xl text-left">
        
        <!-- Top-Left Name Picture -->
        <img 
          src="daanishran.png" 
          alt="Daanish Qayyum" 
          class="w-64 sm:w-80 mb-6"
        />

        <!-- Bio Text Below Name -->
        <div class="bg-pink-100/85 backdrop-blur-sm p-5 rounded-2xl shadow-sm">
          <p class="text-gray-900 mb-3 text-lg font-medium">
            Hi! I'm a 15-year-old aspiring mechanical engineer attending Edison Academy Magnet School.
          </p>
          
          <p class="text-gray-900 text-lg font-medium">
            I like to watch films, take <a href="photography.html" class="underline font-bold hover:text-pink-600">pictures</a>, and build.
          </p>
        </div>

      </div>
    </div>

    <!-- Pink Space Below (Visible When Scrolling) -->
    <div class="p-8"></div>

  </body>
</html>
