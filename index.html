<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://tailwindcss.com"></script>
    <title>Daanish Qayyum</title>
  </head>
  <body class="bg-pink-100 text-center min-h-screen p-8">

    <!-- Top-Left Name Picture -->
    <header class="p-6 text-left">
      <img 
        src="daanishran.png" 
        alt="Daanish Qayyum" 
        class="w-64 sm:w-80 mix-blend-multiply"
      />
    </header>

    <!-- Main Content -->
    <main class="max-w-xl mx-auto px-6 mt-12 text-center">
      
      <!-- Bio Section (with large bottom margin so you scroll to reach the video) -->
      <div class="mb-96">
        <p class="text-gray-900 mb-3 text-lg font-medium">
          Hi! I'm a 15-year-old aspiring mechanical engineer attending Edison Academy Magnet School.
        </p>
        
        <p class="text-gray-900 text-lg font-medium">
          I like to watch films, take <a href="photography.html" class="underline font-bold hover:text-pink-600">pictures</a>, and build.
        </p>
      </div>

      <!-- Smaller Looping Video at the Bottom -->
      <div class="pb-16">
        <video 
          src="video.mp4" 
          autoplay 
          loop 
          muted 
          playsinline 
          class="mx-auto rounded-xl shadow-lg w-full max-w-xs"
        ></video>
      </div>

    </main>

  </body>
</html>
